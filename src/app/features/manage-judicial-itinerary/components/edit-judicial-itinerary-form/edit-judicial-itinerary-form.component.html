<form
  #form="ngForm"
  pdk-form
  errorFormat="extended"
  (errors)="errors.emit($event)"
  (validSubmit)="submitForm.emit(form.value)"
>
  <pdk-grid container pdk-margin-top="2">
    <pdk-grid full>
      <pdk-grid two-thirds pdk-padding-left="0">
        <h2 pdk-typography="heading-medium">Sitting days</h2>
        <date-range
          required
          name="availability"
          [ngModel]="initialValues()?.availability ?? {}"
          #dateRange="ngModel"
          disableWeekend
          [minStartDate]="minStartDate()"
          requiredEndDate
          requiredStartDate
          [serverError]="serverSubmissionError()"
          [getMinEndDate]="getMinEndDate"
          [getMaxEndDate]="getMaxEndDate"
          [onStartDateChange]="onStartDateChange"
          [startDateErrorMessages]="startDateErrorMessages()"
          [endDateErrorMessages]="endDateErrorMessages"
        ></date-range>
      </pdk-grid>
      <pdk-divider pdk-margin-top="0"></pdk-divider>
      <pdk-grid two-thirds pdk-padding-left="0">
        <days-of-week-selector
          name="sittingDays"
          [ngModel]="initialValues()?.sittingDays ?? []"
          label="Sitting days in a week (optional)"
        ></days-of-week-selector>
      </pdk-grid>
      <pdk-divider pdk-margin-top="0"></pdk-divider>
      <pdk-grid two-thirds pdk-padding-left="0">
        <pdk-form-field
          label="Session"
          labelType="small"
          [errorMessages]="[
            {
              rule: 'required',
              message: 'Select a session'
            }
          ]"
        >
          <pdk-radio-group
            name="session"
            [ngModel]="sessionSignal()"
            (ngModelChange)="sessionSignal.set($event)"
            [options]="sessionOptions"
            required
            data-test-id="session-radio-group"
          >
          </pdk-radio-group>
        </pdk-form-field>
      </pdk-grid>
      <pdk-divider pdk-margin-top="0"></pdk-divider>
      <pdk-grid two-thirds pdk-padding-left="0">
        <pdk-form-field
          hintText="Refers to standard workdays (Mon–Fri)"
          label="Non-sitting days (optional)"
          labelType="small"
          labelForErrorSummary="Non-sitting days has an error."
        >
          <unavailabilities-control
            name="unavailabilities"
            (errors)="errors.emit($event)"
            [availabilityDateRange]="dateRange.value ?? {}"
            [ngModel]="initialValues()?.unavailabilities ?? []"
            [inDateRange]="dateRange.value ?? {}"
          ></unavailabilities-control>
        </pdk-form-field>
      </pdk-grid>
    </pdk-grid>
    <pdk-grid two-thirds>
      <pdk-button-group>
        <button type="submit" pdk-button data-test-id="save-changes-button">Save changes</button>
      </pdk-button-group>
    </pdk-grid>
  </pdk-grid>
</form>
